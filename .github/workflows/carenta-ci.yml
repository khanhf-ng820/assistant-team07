name: CARENTA CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  carenta-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync API dependencies
        run: uv sync --project services/carenta-api --locked --python 3.12
      - name: Lint FastAPI service
        run: uv run --project services/carenta-api ruff check --config services/carenta-api/pyproject.toml services/carenta-api
      - name: Run FastAPI test suite
        run: uv run --project services/carenta-api python -m pytest -c services/carenta-api/pyproject.toml services/carenta-api/tests -q
      - name: Verify OpenAPI vs mobile contract fields
        run: uv run --project services/carenta-api python scripts/check_openapi_contracts.py

  carenta-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint check
        run: npm run lint
      - name: Run Jest unit and navigation tests
        run: npm test
      - name: Verify Android JS bundle export
        env:
          CI: "1"
        run: npx expo export --platform android --output-dir /tmp/carenta-export-android
      - name: Verify iOS JS bundle export
        env:
          CI: "1"
        run: npx expo export --platform ios --output-dir /tmp/carenta-export-ios
      - name: Check Expo dependency compatibility (advisory)
        continue-on-error: true
        env:
          CI: "1"
        run: npx expo install --check
